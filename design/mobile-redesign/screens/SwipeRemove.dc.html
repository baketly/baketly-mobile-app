<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swipe an ingredient off a recipe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5f6a2c;text-decoration:none}a:hover{color:#6a7532}
input::placeholder{color:#b9b4a8}
.tnum{font-feature-settings:'tnum'}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #faf6f0; color: #33301f; font-family: 'Poppins', sans-serif; font-size: 14px; line-height: 1.6; display: flex; flex-direction: column">

  <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 54px 20px 0; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 4px; min-height: 44px; font-size: 13px; font-weight: 600; color: #5f6a2c; margin-left: -4px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Recipes</a>
      <span style="font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: #c9a24a">New recipe</span>
      <span style="width: 64px"></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 12px">
        <button type="button" aria-label="Add a photo" style="flex: none; width: 56px; height: 56px; border-radius: 16px; border: 1.5px dashed #c9c2b2; background: #ffffff; color: #8a8578; display: grid; place-items: center; cursor: pointer; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v12H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button>
        <input type="text" value="Mini Chocolate Babka" aria-label="Recipe name" style="flex: 1; min-width: 0; box-sizing: border-box; height: 56px; padding: 0 16px; border: 1px solid #e5dfd2; border-radius: 16px; background: #ffffff; color: #33301f; font-family: inherit; font-weight: 600; font-size: 20px">
      </div>
      <div style="display: flex; gap: 10px">
        <div style="flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 48px; padding: 0 6px 0 14px; border: 1px solid #e5dfd2; border-radius: 16px; background: #ffffff">
          <label for="makes" style="font-size: 12px; color: #7a7464">Makes</label>
          <div style="display: flex; align-items: center">
            <button type="button" aria-label="One fewer" style="width: 36px; height: 36px; border: 0; background: none; color: #7a7464; font-family: inherit; font-size: 18px; cursor: pointer; padding: 0">−</button>
            <input id="makes" type="text" value="12" inputmode="numeric" class="tnum" style="width: 32px; height: 36px; border: 0; background: none; color: #33301f; font-family: inherit; font-weight: 600; font-size: 15px; text-align: center">
            <button type="button" aria-label="One more" style="width: 36px; height: 36px; border: 0; background: none; color: #7a7464; font-family: inherit; font-size: 18px; cursor: pointer; padding: 0">+</button>
          </div>
        </div>
        <div style="flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 48px; padding: 0 14px; border: 1px solid #e5dfd2; border-radius: 16px; background: #ffffff">
          <label for="active" style="font-size: 12px; color: #7a7464">Active time</label>
          <div style="display: flex; align-items: baseline; gap: 4px"><input id="active" type="text" value="40" inputmode="numeric" class="tnum" style="width: 36px; height: 36px; border: 0; background: none; color: #33301f; font-family: inherit; font-weight: 600; font-size: 15px; text-align: right"><span style="font-size: 12px; color: #8a8578">min</span></div>
        </div>
      </div>
      <button type="button" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 44px; padding: 0 14px; border: 1px solid #e5dfd2; border-radius: 16px; background: #ffffff; color: #33301f; font-family: inherit; font-size: 12px; cursor: pointer; text-align: left">
        <span style="color: #7a7464">Group</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600">Babka<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8578" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px">
        <h6 style="margin: 0; font-size: 15px; font-weight: 700; line-height: 1.3">Ingredients</h6>
        <a href="RecipeParts.dc.html" style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #5f6a2c"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="2"></rect><rect x="3" y="14" width="18" height="6" rx="2"></rect></svg>Split into parts</a>
      </div>
      <div style="background: #ffffff; border-radius: 22px; padding: 0 16px; box-shadow: 0 2px 10px rgba(60,55,30,.07); display: flex; flex-direction: column; overflow: hidden">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
          <div style="position: relative; overflow: hidden; max-height: {{ r.maxH }}; opacity: {{ r.opacity }}; transition: {{ r.collapse }}; border-top: {{ r.border }}">
            <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 72px; display: flex; align-items: center; justify-content: flex-start; padding-left: 4px">
              <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; background: #b0563e; color: #ffffff; display: grid; place-items: center; transform: {{ r.discScale }}; transition: {{ r.discTransition }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
            </div>
            <div onPointerDown="{{ r.down }}" onPointerMove="{{ r.move }}" onPointerUp="{{ r.up }}" onPointerCancel="{{ r.up }}" style="position: relative; background: #ffffff; display: flex; align-items: center; gap: 10px; padding: 6px 0; min-height: 46px; box-sizing: border-box; transform: {{ r.transform }}; transition: {{ r.transition }}; touch-action: pan-y; user-select: none">
              <span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 500">{{ r.name }}</span>
              <span class="tnum" style="width: 56px; height: 36px; display: flex; align-items: center; justify-content: flex-end; padding: 0 8px; border: 1px solid #e5dfd2; border-radius: 10px; box-sizing: border-box; font-size: 13px; font-weight: 600">{{ r.amount }}</span>
              <span style="width: 18px; font-size: 12px; color: #8a8578">{{ r.unit }}</span>
              <span class="tnum" style="width: 46px; text-align: right; font-size: 13px; color: #7a7464">{{ r.cost }}</span>
            </div>
          </div>
        </sc-for>
        <a href="AddIngredient.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-top: 1px solid #eee7d9; color: #5f6a2c; font-size: 13px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add more</a>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px">
        <h6 style="margin: 0; font-size: 15px; font-weight: 700; line-height: 1.3">Packaging</h6>
        <span class="tnum" style="font-size: 12px; color: #8a8578">$0.16 each</span>
      </div>
      <div style="background: #ffffff; border-radius: 16px; padding: 0 16px; box-shadow: 0 2px 10px rgba(60,55,30,.07); display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 44px">
          <span style="flex: 1; font-size: 14px; font-weight: 500">Kraft box · small</span>
          <span class="tnum" style="font-size: 13px; color: #7a7464">$0.16</span>
          <button type="button" aria-label="Remove Kraft box" style="width: 32px; height: 32px; border-radius: 50%; border: 0; background: none; color: #c9c2b2; font-family: inherit; font-size: 18px; line-height: 1; cursor: pointer; padding: 0; margin-right: -8px">×</button>
        </div>
      </div>
    </div>

  </div>

  <div style="flex: none; background: #ffffff; border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgba(60,55,30,.10); padding: 16px 20px 26px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <label for="sell" style="font-size: 11px; font-weight: 600">Sells for</label>
        <div style="display: flex; align-items: center; gap: 2px">
          <span style="font-size: 26px; font-weight: 600; color: #8a8578">$</span>
          <input id="sell" type="text" value="10.00" inputmode="decimal" class="tnum" style="width: 104px; height: 40px; padding: 0 8px; border: 1px solid #e5dfd2; border-radius: 10px; background: #ffffff; color: #33301f; font-family: inherit; font-weight: 600; font-size: 26px; text-align: right">
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right">
        <span style="font-size: 11px; color: #8a8578">Each costs <span class="tnum" style="color: #33301f; font-weight: 600">$0.73</span></span>
        <span class="tnum" style="font-size: 22px; font-weight: 600; color: #5f6a2c; line-height: 1.2">You earn $9.27</span>
        <span style="font-size: 11px; color: #8a8578">93% margin</span>
      </div>
    </div>
    <a href="Recipe.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 14px; background: #7d8a3c; color: #ffffff; font-size: 13px; font-weight: 600">Save recipe</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
// Frozen mid-swipe on the canvas: the butter row has been pulled 64px to the right and the red × has grown in behind it.
this.state = { items: [
{ id: 'flour', name: 'Bread flour', amount: '500', unit: 'g', cost: '$0.95' },
{ id: 'choc', name: 'Dark chocolate 70%', amount: '180', unit: 'g', cost: '$3.24' },
{ id: 'butter', name: 'Butter, unsalted', amount: '150', unit: 'g', cost: '$1.80' },
{ id: 'eggs', name: 'Eggs, large', amount: '2', unit: 'pc', cost: '$0.90' }
], drag: { butter: 64 }, active: null, startX: 0, removed: {}, gone: {} };
}
renderVals() {
const st = this.state;
const REVEAL = 72;   // how far the row must travel before letting go removes it
const ease = 'transform 220ms cubic-bezier(.2,.8,.2,1)';
const rows = st.items.map((it, i) => {
const x = st.gone[it.id] ? 420 : Math.max(0, st.drag[it.id] || 0);
const dragging = st.active === it.id;
const p = Math.min(1, x / REVEAL);
return {
...it,
border: i === 0 ? '0' : '1px solid #eee7d9',
transform: 'translateX(' + x + 'px)',
transition: dragging ? 'none' : ease,
discScale: 'scale(' + (0.4 + 0.6 * p).toFixed(2) + ')',
discTransition: dragging ? 'none' : 'transform 220ms cubic-bezier(.2,.8,.2,1)',
maxH: st.removed[it.id] ? '0px' : '80px',
opacity: st.removed[it.id] ? '0' : '1',
collapse: 'max-height 240ms ease 180ms, opacity 180ms ease 120ms',
down: e => { if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId); this.setState({ active: it.id, startX: e.clientX - (st.drag[it.id] || 0) }); },
move: e => { if (this.state.active !== it.id) return; const d = e.clientX - this.state.startX; this.setState({ drag: { ...this.state.drag, [it.id]: d < 0 ? d / 4 : Math.min(d, 140) } }); },
up: e => {
if (this.state.active !== it.id) return;
const d = this.state.drag[it.id] || 0;
if (d >= REVEAL) {
// Past the threshold: the row slides off to the right, then the gap closes.
this.setState({ active: null, gone: { ...this.state.gone, [it.id]: true } });
setTimeout(() => this.setState({ removed: { ...this.state.removed, [it.id]: true } }), 200);
} else {
this.setState({ active: null, drag: { ...this.state.drag, [it.id]: 0 } });
}
}
};
});
return { rows };
}
}
</script>
</body>
</html>
