<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add ingredients modal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5f6a2c;text-decoration:none}a:hover{color:#6a7532}
input::placeholder{color:#b9b4a8}
.tnum{font-feature-settings:'tnum'}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #faf6f0; color: #33301f; font-family: 'Poppins', sans-serif; font-size: 14px; line-height: 1.6; display: flex; flex-direction: column">

  <div aria-hidden="true" style="padding: 54px 20px 0; display: flex; flex-direction: column; gap: 28px; opacity: 0.55">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <span style="display: flex; align-items: center; gap: 4px; min-height: 44px; font-size: 13px; font-weight: 600; color: #5f6a2c">‹ Recipes</span>
      <span style="font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: #c9a24a">New recipe</span>
      <span style="width: 64px"></span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="flex: none; width: 56px; height: 56px; border-radius: 16px; border: 1.5px dashed #c9c2b2; background: #ffffff"></span>
      <span style="flex: 1; height: 56px; padding: 0 16px; border: 1px solid #e5dfd2; border-radius: 16px; background: #ffffff; display: flex; align-items: center; font-weight: 600; font-size: 20px">Mini Chocolate Babka</span>
    </div>
  </div>

  <div role="dialog" aria-modal="true" aria-label="Add ingredients" style="position: absolute; left: 0; right: 0; bottom: 0; height: 640px; background: #faf6f0; border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(60,55,30,.18); padding: 10px 20px 0; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
    <div style="width: 36px; height: 4px; border-radius: 2px; background: #c9c2b2; align-self: center"></div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <h2 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.3">Add ingredients</h2>
      <a href="NewRecipe.dc.html" aria-label="Close" style="width: 40px; height: 40px; border-radius: 50%; background: #ffffff; color: #33301f; display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>

    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border: 1px solid #e5dfd2; border-radius: 16px; background: #ffffff; cursor: text">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8578" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="search" placeholder="Search your pantry" aria-label="Search your pantry" style="flex: 1; min-width: 0; border: 0; outline: none; background: none; font-family: inherit; font-size: 14px; color: #33301f">
    </label>

    <div style="display: flex; gap: 6px; overflow: hidden">
      <button type="button" aria-pressed="true" style="height: 30px; padding: 0 11px; flex: none; border: 1px solid #7d8a3c; border-radius: 999px; background: #7d8a3c; color: #ffffff; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer">All</button>
      <button type="button" style="height: 30px; padding: 0 11px; flex: none; border: 1px solid #e5dfd2; border-radius: 999px; background: #ffffff; color: #33301f; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer">Flour &amp; grains</button>
      <button type="button" style="height: 30px; padding: 0 11px; flex: none; border: 1px solid #e5dfd2; border-radius: 999px; background: #ffffff; color: #33301f; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer">Dairy</button>
      <button type="button" style="height: 30px; padding: 0 11px; flex: none; border: 1px solid #e5dfd2; border-radius: 999px; background: #ffffff; color: #33301f; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer">Chocolate</button>
      <button type="button" style="height: 30px; padding: 0 11px; flex: none; border: 1px solid #e5dfd2; border-radius: 999px; background: #ffffff; color: #33301f; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer">Sugar</button>
    </div>

    <div style="flex: 1; min-height: 0; overflow: hidden; background: #ffffff; border-radius: 22px; padding: 4px 16px; box-shadow: 0 2px 10px rgba(60,55,30,.07); display: flex; flex-direction: column">
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 0; min-height: 52px; box-sizing: border-box; cursor: pointer">
        <input type="checkbox" checked aria-label="Bread flour" style="width: 22px; height: 22px; margin: 0; accent-color: #7d8a3c">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500; line-height: 1.3">Bread flour</span><span style="font-size: 12px; color: #8a8578">$1.90 per kg</span></span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 0; min-height: 52px; box-sizing: border-box; border-top: 1px solid #eee7d9; cursor: pointer">
        <input type="checkbox" checked aria-label="Dark chocolate" style="width: 22px; height: 22px; margin: 0; accent-color: #7d8a3c">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500; line-height: 1.3">Dark chocolate 70%</span><span style="font-size: 12px; color: #8a8578">$18.00 per kg</span></span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 0; min-height: 52px; box-sizing: border-box; border-top: 1px solid #eee7d9; cursor: pointer">
        <input type="checkbox" checked aria-label="Butter" style="width: 22px; height: 22px; margin: 0; accent-color: #7d8a3c">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500; line-height: 1.3">Butter, unsalted</span><span style="font-size: 12px; color: #8a8578">$12.00 per kg</span></span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 0; min-height: 52px; box-sizing: border-box; border-top: 1px solid #eee7d9; cursor: pointer">
        <input type="checkbox" aria-label="Eggs" style="width: 22px; height: 22px; margin: 0; accent-color: #7d8a3c">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500; line-height: 1.3">Eggs, large</span><span style="font-size: 12px; color: #8a8578">$0.45 each</span></span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 0; min-height: 52px; box-sizing: border-box; border-top: 1px solid #eee7d9; cursor: pointer">
        <input type="checkbox" aria-label="Caster sugar" style="width: 22px; height: 22px; margin: 0; accent-color: #7d8a3c">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500; line-height: 1.3">Caster sugar</span><span style="font-size: 12px; color: #8a8578">$2.40 per kg</span></span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 0; min-height: 52px; box-sizing: border-box; border-top: 1px solid #eee7d9; cursor: pointer">
        <input type="checkbox" aria-label="Whole milk" style="width: 22px; height: 22px; margin: 0; accent-color: #7d8a3c">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500; line-height: 1.3">Whole milk</span><span style="font-size: 12px; color: #8a8578">$1.60 per l</span></span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 0; min-height: 52px; box-sizing: border-box; border-top: 1px solid #eee7d9; cursor: pointer">
        <input type="checkbox" aria-label="Instant yeast" style="width: 22px; height: 22px; margin: 0; accent-color: #7d8a3c">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500; line-height: 1.3">Instant yeast</span><span style="font-size: 12px; color: #8a8578">$0.60 per 10 g</span></span>
      </label>
    </div>

    <div style="padding: 0 0 30px; display: flex; flex-direction: column; gap: 8px">
      <a href="NewRecipeFilled.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 14px; background: #7d8a3c; color: #ffffff; font-size: 13px; font-weight: 600">Add 3 ingredients</a>
      <a href="NewRecipe.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 36px; font-size: 12px; font-weight: 600; color: #5f6a2c">Not in your pantry? Create a new ingredient</a>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
