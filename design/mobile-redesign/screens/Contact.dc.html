<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #faf6f0; color: #33301f; font-family: 'Poppins', sans-serif; font-size: 14px; line-height: 1.6; display: flex; flex-direction: column">

      <input id="subject" type="text" placeholder="In a few words" maxlength="120" style="width: 100%; box-sizing: border-box; height: 48px; padding: 0 16px; border: 1px solid #e5dfd2; border-radius: 16px; background: #ffffff; color: #33301f; font-family: inherit; font-size: 14px">
    </div>

    <div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 6px">
      <label for="message" style="font-size: 11px; font-weight: 600; padding: 0 2px">Message</label>
