<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New recipe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5f6a2c;text-decoration:none}a:hover{color:#6a7532}
input::placeholder{color:#b9b4a8}
.tnum{font-feature-settings:'tnum'}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #faf6f0; color: #33301f; font-family: 'Poppins', sans-serif; font-size: 14px; line-height: 1.6; display: flex; flex-direction: column">

  <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 54px 20px 0; display: flex; flex-direction: column; gap: 28px">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 4px; min-height: 44px; font-size: 13px; font-weight: 600; color: #5f6a2c; margin-left: -4px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Recipes</a>
      <span style="font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: #c9a24a">New recipe</span>
      <span style="width: 64px"></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 12px">
        <button type="button" aria-label="Add a photo" style="flex: none; width: 56px; height: 56px; border-radius: 16px; border: 1.5px dashed #c9c2b2; background: #ffffff; color: #8a8578; display: grid; place-items: center; cursor: pointer; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v12H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button>
        <input type="text" placeholder="Name your recipe" aria-label="Recipe name" style="flex: 1; min-width: 0; box-sizing: border-box; height: 56px; padding: 0 16px; border: 1px solid #e5dfd2; border-radius: 16px; background: #ffffff; color: #33301f; font-family: inherit; font-weight: 600; font-size: 20px">
      </div>
      <div style="display: flex; gap: 10px">
        <div style="flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 48px; padding: 0 6px 0 14px; border: 1px solid #e5dfd2; border-radius: 16px; background: #ffffff">
          <label for="makes" style="font-size: 12px; color: #7a7464">Makes</label>
          <div style="display: flex; align-items: center">
            <button type="button" aria-label="One fewer" style="width: 36px; height: 36px; border: 0; background: none; color: #7a7464; font-family: inherit; font-size: 18px; cursor: pointer; padding: 0">−</button>
            <input id="makes" type="text" value="12" inputmode="numeric" class="tnum" style="width: 32px; height: 36px; border: 0; background: none; color: #33301f; font-family: inherit; font-weight: 600; font-size: 15px; text-align: center">
            <button type="button" aria-label="One more" style="width: 36px; height: 36px; border: 0; background: none; color: #7a7464; font-family: inherit; font-size: 18px; cursor: pointer; padding: 0">+</button>
          </div>
        </div>
        <div style="flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 48px; padding: 0 14px; border: 1px solid #e5dfd2; border-radius: 16px; background: #ffffff">
          <label for="active" style="font-size: 12px; color: #7a7464">Active time</label>
          <div style="display: flex; align-items: baseline; gap: 4px"><input id="active" type="text" placeholder="—" inputmode="numeric" class="tnum" style="width: 36px; height: 36px; border: 0; background: none; color: #33301f; font-family: inherit; font-weight: 600; font-size: 15px; text-align: right"><span style="font-size: 12px; color: #8a8578">min</span></div>
        </div>
      </div>
      <button type="button" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 48px; padding: 0 14px; border: 1px solid #e5dfd2; border-radius: 16px; background: #ffffff; color: #33301f; font-family: inherit; font-size: 12px; cursor: pointer; text-align: left">
        <span style="color: #7a7464">Group</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #b9b4a8">Choose a group<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8578" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px">
        <h6 style="margin: 0; font-size: 15px; font-weight: 700; line-height: 1.3">Ingredients</h6>
        <a href="RecipeParts.dc.html" style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #5f6a2c"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="2"></rect><rect x="3" y="14" width="18" height="6" rx="2"></rect></svg>Split into parts</a>
      </div>
      <a href="AddIngredient.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 64px; border: 1.5px dashed #c6cd93; border-radius: 22px; background: #ffffff; color: #5f6a2c; font-size: 13px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add ingredients</a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px">
        <h6 style="margin: 0; font-size: 15px; font-weight: 700; line-height: 1.3">Packaging</h6>
        <span style="font-size: 12px; color: #8a8578">optional</span>
      </div>
      <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 1.5px dashed #e5dfd2; border-radius: 16px; background: #ffffff; color: #7a7464; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add packaging</button>
    </div>

  </div>

  <div style="flex: none; background: #ffffff; border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgba(60,55,30,.10); padding: 18px 20px 30px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <label for="sell" style="font-size: 11px; font-weight: 600">Sells for</label>
        <div style="display: flex; align-items: center; gap: 2px">
          <span style="font-size: 26px; font-weight: 600; color: #8a8578">$</span>
          <input id="sell" type="text" placeholder="0.00" inputmode="decimal" class="tnum" style="width: 104px; height: 40px; padding: 0 8px; border: 1px solid #e5dfd2; border-radius: 10px; background: #ffffff; color: #33301f; font-family: inherit; font-weight: 600; font-size: 26px; text-align: right">
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right">
        <span style="font-size: 11px; color: #8a8578">Each costs</span>
        <span class="tnum" style="font-size: 20px; font-weight: 600; color: #b9b4a8; line-height: 1.2">—</span>
        <span style="font-size: 11px; color: #8a8578">add ingredients to see it</span>
      </div>
    </div>
    <button type="button" disabled style="height: 48px; border: 0; border-radius: 14px; background: #c6cd93; color: #ffffff; font-family: inherit; font-size: 13px; font-weight: 600">Save recipe</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
