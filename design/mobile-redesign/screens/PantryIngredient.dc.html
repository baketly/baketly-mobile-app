<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pantry: new ingredient</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5f6a2c;text-decoration:none}a:hover{color:#6a7532}
input::placeholder{color:#b9b4a8}
.tnum{font-feature-settings:'tnum'}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #faf6f0; color: #33301f; font-family: 'Poppins', sans-serif; font-size: 14px; line-height: 1.6; display: flex; flex-direction: column">

  <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 54px 20px 0; display: flex; flex-direction: column; gap: 24px">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 4px; min-height: 44px; font-size: 13px; font-weight: 600; color: #5f6a2c; margin-left: -4px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Pantry</a>
      <span style="font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: #c9a24a">New ingredient</span>
      <span style="width: 56px"></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 12px">
        <button type="button" aria-label="Scan the package label" style="flex: none; width: 56px; height: 56px; border-radius: 16px; border: 1.5px dashed #c9a24a; background: #ffffff; color: #5f6a2c; display: grid; place-items: center; cursor: pointer; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M7 12h10"></path></svg></button>
        <input type="text" value="Dark chocolate 70%" aria-label="Ingredient name" style="flex: 1; min-width: 0; box-sizing: border-box; height: 56px; padding: 0 16px; border: 1px solid #e5dfd2; border-radius: 16px; background: #ffffff; color: #33301f; font-family: inherit; font-weight: 600; font-size: 20px">
      </div>
      <div style="font-size: 12px; color: #8a8578; margin-top: -6px; padding: 0 2px">Scan the label to fill in price, size and nutrition.</div>

      <div style="display: flex; gap: 10px">
        <div style="flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 48px; padding: 0 14px; border: 1px solid #e5dfd2; border-radius: 16px; background: #ffffff">
          <label for="pkg-price" style="font-size: 12px; color: #7a7464">Package</label>
          <div style="display: flex; align-items: baseline; gap: 2px"><span style="font-size: 13px; color: #8a8578">$</span><input id="pkg-price" type="text" value="18.00" inputmode="decimal" class="tnum" style="width: 54px; height: 36px; border: 0; background: none; color: #33301f; font-family: inherit; font-weight: 600; font-size: 15px; text-align: right"></div>
        </div>
        <div style="flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 6px; height: 48px; padding: 0 6px 0 14px; border: 1px solid #e5dfd2; border-radius: 16px; background: #ffffff">
          <label for="pkg-size" style="font-size: 12px; color: #7a7464">Size</label>
          <div style="display: flex; align-items: center; gap: 2px">
            <input id="pkg-size" type="text" value="1000" inputmode="decimal" class="tnum" style="width: 48px; height: 36px; border: 0; background: none; color: #33301f; font-family: inherit; font-weight: 600; font-size: 15px; text-align: right">
            <button type="button" aria-label="Unit: grams" style="display: flex; align-items: center; gap: 2px; height: 32px; padding: 0 8px; border: 0; border-radius: 10px; background: #eef0dd; color: #5f6a2c; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer">g<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 10px">
        <a href="CategoryPicker.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 48px; padding: 0 14px; border: 1px solid #e5dfd2; border-radius: 16px; background: #ffffff; color: #33301f; font-size: 12px; text-align: left">
          <span style="color: #7a7464">Category</span>
          <span style="display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600">Chocolate<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8a8578" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
        </a>
        <div style="flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 48px; padding: 0 14px; border: 1px solid #e5dfd2; border-radius: 16px; background: #ffffff">
          <label for="supplier" style="font-size: 12px; color: #7a7464">Supplier</label>
          <input id="supplier" type="text" placeholder="e.g. Costco" style="width: 84px; height: 36px; border: 0; background: none; color: #33301f; font-family: inherit; font-weight: 600; font-size: 13px; text-align: right">
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px">
        <h6 style="margin: 0; font-size: 15px; font-weight: 700; line-height: 1.3">Nutrition</h6>
        <span style="font-size: 12px; color: #8a8578">optional · per 100 g</span>
      </div>
      <div style="background: #ffffff; border-radius: 22px; padding: 14px 16px; box-shadow: 0 2px 10px rgba(60,55,30,.07); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
        <div style="display: flex; flex-direction: column; gap: 4px"><label for="kcal" style="font-size: 11px; font-weight: 600; color: #7a7464">kcal</label><input id="kcal" type="text" value="479" inputmode="decimal" class="tnum" style="width: 100%; box-sizing: border-box; height: 40px; padding: 0 8px; border: 1px solid #e5dfd2; border-radius: 10px; background: #ffffff; color: #33301f; font-family: inherit; font-weight: 600; font-size: 14px; text-align: center"></div>
        <div style="display: flex; flex-direction: column; gap: 4px"><label for="protein" style="font-size: 11px; font-weight: 600; color: #7a7464">Protein</label><input id="protein" type="text" value="4.2" inputmode="decimal" class="tnum" style="width: 100%; box-sizing: border-box; height: 40px; padding: 0 8px; border: 1px solid #e5dfd2; border-radius: 10px; background: #ffffff; color: #33301f; font-family: inherit; font-weight: 600; font-size: 14px; text-align: center"></div>
        <div style="display: flex; flex-direction: column; gap: 4px"><label for="carbs" style="font-size: 11px; font-weight: 600; color: #7a7464">Carbs</label><input id="carbs" type="text" value="63" inputmode="decimal" class="tnum" style="width: 100%; box-sizing: border-box; height: 40px; padding: 0 8px; border: 1px solid #e5dfd2; border-radius: 10px; background: #ffffff; color: #33301f; font-family: inherit; font-weight: 600; font-size: 14px; text-align: center"></div>
        <div style="display: flex; flex-direction: column; gap: 4px"><label for="fat" style="font-size: 11px; font-weight: 600; color: #7a7464">Fat</label><input id="fat" type="text" value="24" inputmode="decimal" class="tnum" style="width: 100%; box-sizing: border-box; height: 40px; padding: 0 8px; border: 1px solid #e5dfd2; border-radius: 10px; background: #ffffff; color: #33301f; font-family: inherit; font-weight: 600; font-size: 14px; text-align: center"></div>
        <div style="display: flex; flex-direction: column; gap: 4px"><label for="sugar" style="font-size: 11px; font-weight: 600; color: #7a7464">Sugar</label><input id="sugar" type="text" value="29" inputmode="decimal" class="tnum" style="width: 100%; box-sizing: border-box; height: 40px; padding: 0 6px; border: 1px solid #e5dfd2; border-radius: 10px; background: #ffffff; color: #33301f; font-family: inherit; font-weight: 600; font-size: 14px; text-align: center"></div>
        <div style="grid-column: 1 / -1; font-size: 11px; color: #8a8578">Filled from the label scan. Used for macros on recipe pages.</div>
      </div>
    </div>

  </div>

  <div style="flex: none; background: #ffffff; border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgba(60,55,30,.10); padding: 18px 20px 30px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 11px; color: #8a8578">Cost per g</span>
        <span class="tnum" style="font-size: 22px; font-weight: 600; line-height: 1.2">$0.018</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right">
        <span style="font-size: 11px; color: #8a8578">In a babka batch</span>
        <span class="tnum" style="font-size: 13px; font-weight: 600; color: #5f6a2c">180 g · $3.24</span>
      </div>
    </div>
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 14px; background: #7d8a3c; color: #ffffff; font-size: 13px; font-weight: 600">Save ingredient</a>
  </div>

</div>
</x-dc>

</html>
